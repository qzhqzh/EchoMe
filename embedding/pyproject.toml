[project]
name = "echome-embedding"
version = "0.2.0"
description = "EchoMe Embedding Service - BGE-M3"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sentence-transformers==6.0.0",
    "torch==2.7.1",
    "numpy>=1.24.0",
    "pydantic>=2.7.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]
download = ["modelscope>=1.10.0"]

[tool.uv.sources]
torch = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
