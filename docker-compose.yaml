version: "3.9"

services:
  hub:
    build: ./hub
    ports:
      - "20000:20000"
    env_file:
      - ./hub/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./hub:/app
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 20000 --reload"

  web:
    build: ./web
    ports:
      - "20001:80"
    depends_on:
      - hub

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: echome
      POSTGRES_PASSWORD: echome
      POSTGRES_DB: echome
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./hub/scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echome"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
