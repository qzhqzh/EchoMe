services:
  hub:
    restart: unless-stopped
    build: ./hub
    ports:
      - "20000:20000"
    env_file:
      - ./hub/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      embedding:
        condition: service_healthy
    environment:
      - ECHOME_EMBEDDING_URL=http://embedding:20002
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 20000"

  web:
    restart: unless-stopped
    build: ./web
    ports:
      - "20001:80"
    depends_on:
      - hub

  embedding:
    restart: unless-stopped
    build: ./embedding
    ports:
      - "20002:20002"
    volumes:
      - ./data/embedding-models:/app/models
    environment:
      - MODEL_DIR=/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:20002/health')"]
      interval: 10s
      timeout: 30s
      retries: 3
      start_period: 120s

  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: echome
      POSTGRES_PASSWORD: echome
      POSTGRES_DB: echome
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./hub/scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echome"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    volumes:
      - ./data/redis:/data
