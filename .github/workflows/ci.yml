name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check echome/ echome_mcp/
      - run: ruff check hub/app/ --ignore E402

  test-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: echome --help
      - run: python -c "from echome.main import app; print('CLI import OK')"

  test-hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    env:
      ECHOME_JWT_SECRET: "ci-test-secret-at-least-32-characters-long"
      ECHOME_DATABASE_URL: "sqlite+aiosqlite:///./test.db"
      ECHOME_DEBUG: "true"
      ECHOME_EMBEDDING_URL: "http://localhost:9999"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" aiosqlite
      - run: python -c "from app.core.jwt import create_access_token; print('Hub imports OK')"
      - run: python -c "from app.schemas.memory import MemoryCreate, MemoryPatch; print('Schemas OK')"
      - run: pytest tests/test_auth.py tests/test_memories.py -x -q -k "not EndToEnd"

  build:
    runs-on: ubuntu-latest
    needs: [lint, test-cli, test-hub]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - run: pip install dist/*.whl
      - run: echome --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
