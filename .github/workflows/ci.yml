name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-cli-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run ruff check echome echome_mcp tests
      - run: uv run pytest

  test-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
        working-directory: hub
      - run: uv run ruff check app tests alembic/versions
        working-directory: hub
      - run: uv run pytest
        working-directory: hub

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  build:
    runs-on: ubuntu-latest
    needs: [test-cli-mcp, test-hub, build-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uv venv /tmp/echome-wheel-test
      - run: uv pip install --python /tmp/echome-wheel-test/bin/python dist/*.whl
      - run: /tmp/echome-wheel-test/bin/echome --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
