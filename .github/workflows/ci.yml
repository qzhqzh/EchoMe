name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-cli-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run python scripts/check_project_truth.py
      - run: uv run python scripts/check_doc_contracts.py --surface client
      - run: uv run ruff check echome echome_mcp tests scripts/check_doc_contracts.py scripts/smoke_mcp_stdio.py
      - run: uv run pytest

  test-hub:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: echome_test
          POSTGRES_DB: echome_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U echome_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ECHOME_INTEGRATION_DATABASE_URL: postgresql+asyncpg://echome_test@127.0.0.1:5432/echome_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
        working-directory: hub
      - run: uv run ruff check app tests alembic/versions
        working-directory: hub
      - run: uv run python ../scripts/check_doc_contracts.py --surface hub
        working-directory: hub
      - run: uv run alembic upgrade head
        working-directory: hub
        env:
          ECHOME_DATABASE_URL: ${{ env.ECHOME_INTEGRATION_DATABASE_URL }}
      - run: uv run pytest
        working-directory: hub

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  build:
    runs-on: ubuntu-latest
    needs: [test-cli-mcp, test-hub, build-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uv venv /tmp/echome-wheel-test
      - run: uv pip install --python /tmp/echome-wheel-test/bin/python dist/*.whl
      - run: /tmp/echome-wheel-test/bin/echome --help
      - run: python scripts/smoke_mcp_stdio.py --python /tmp/echome-wheel-test/bin/python
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
