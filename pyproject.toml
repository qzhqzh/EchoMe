[project]
name = "echome"
version = "1.5.0"
description = "EchoMe - Personal memory sync for AI CLI tools (CLI + MCP Server)"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [
    { name = "qzhqzh" },
]
keywords = ["ai", "memory", "cli", "mcp", "claude", "codex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.7.0",
    "cryptography>=43.0.0",
    "mcp>=1.27.0,<2.0.0",  # Structured tool output and annotations used by MCP server
    "starlette>=0.37.0",  # ASGI app for MCP streamable HTTP transport
    "uvicorn>=0.30.0",  # HTTP server runtime for MCP streamable HTTP transport
]

[project.urls]
Homepage = "https://github.com/qzhqzh/EchoMe"
Repository = "https://github.com/qzhqzh/EchoMe"
Issues = "https://github.com/qzhqzh/EchoMe/issues"

[project.scripts]
echome = "echome.main:app"
eme = "echome.main:app"

[project.optional-dependencies]
cli = []  # Marker for CLI-only (lightweight) variant
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["echome", "echome_mcp"]
artifacts = ["echome/seed_memories.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]
ignore = ["E501", "A001", "A002", "B008", "F401"]


[tool.ruff.lint.per-file-ignores]
"hub/alembic/versions/*.py" = ["I001", "UP007"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
