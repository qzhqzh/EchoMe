server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HTML must always describe the current release, including SPA deep links.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        etag off;
        if_modified_since off;
        try_files $uri =404;
    }

    location = /asset-recovery.js {
        add_header Cache-Control "no-store" always;
        etag off;
        if_modified_since off;
        try_files $uri =404;
    }

    # Vue Router: fallback to index.html for SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Hub
    location /api/ {
        proxy_pass http://hub:20000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts - allow longer for embedding computation
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Proxy health check
    location /health {
        proxy_pass http://hub:20000;
        proxy_set_header Host $host;
    }

    # Cached HTML can still request a previous release's entry module. Recover
    # with a fresh HTML URL instead of leaving the application unable to start.
    location ~ ^/assets/index-[A-Za-z0-9_-]+\.js$ {
        try_files $uri /asset-recovery.js;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache only content-addressed build assets for a long time.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
